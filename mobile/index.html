<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover：讓 .screen 的 env(safe-area-inset-*) 真的有值（瀏海機） -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#2563eb" />
    <!-- iOS 從主畫面開啟時以獨立 App 樣式呈現（無網址列） -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="速記" />
    <!-- 這些放在 mobile/public/，用根路徑寫；Vite 會在建置時把開頭的 / 換成 base（'./'），
         所以部署在網域根目錄或子路徑（/astrolabe/）都對得上，且檔名不會被加 hash
         ——manifest 與 sw.js 的內部相對路徑因此才不會斷掉。 -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Astrolabe 速記</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="../src/mobile/main.tsx"></script>
  </body>
</html>
